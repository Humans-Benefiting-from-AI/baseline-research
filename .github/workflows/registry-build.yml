name: Build & Test Registry

on:
  push:
    branches: [main, claude/repo-status-next-steps-qtm836]
    paths:
      - 'registry/web/**'
      - '.github/workflows/registry-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'registry/web/**'
      - '.github/workflows/registry-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: registry/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'registry/web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: registry/web/dist
          retention-days: 5
          if-no-files-found: error

      - name: Build success
        run: echo "✓ Registry built successfully at $(date)"
